<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu lần đầu - Trường tiểu học Đặng Văn Ngữ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 36px 32px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
        }

        .shield-icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #fee2e2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .login-box h4 {
            font-size: 1.32rem;
            font-weight: 700;
            color: #1e293b;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .login-box .subtitle {
            font-size: 0.88rem;
            color: #64748b;
            margin-bottom: 22px;
            line-height: 1.45;
        }

        .btn-primary {
            background-color: #ef4444;
            border: none;
            padding: 11px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-control {
            font-size: 0.92rem;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #f87171;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .input-group-text {
            font-size: 0.92rem;
            padding: 10px 14px;
            border-radius: 8px;
            color: #94a3b8;
        }

        .logout-link {
            font-size: 0.88rem;
            display: inline-block;
            transition: opacity 0.2s;
        }
        .logout-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="text-center mb-3">
            <div class="shield-icon-wrap">
                <i class="fas fa-shield-alt text-danger fs-3"></i>
            </div>
            <h4 class="fw-bold text-dark">Yêu cầu đổi mật khẩu</h4>
            <p class="subtitle">Đây là lần đầu bạn đăng nhập. Vui lòng đổi mật khẩu để bảo mật tài khoản.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'danger' }} d-flex align-items-center py-2 px-3 mb-3" style="font-size: 0.88rem;" role="alert">
                    <i class="fas fa-exclamation-circle me-2 flex-shrink-0"></i>
                    <div>{{ message }}</div>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Mật khẩu hiện tại</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-unlock"></i></span>
                    <input type="password" name="old_password" class="form-control border-start-0 bg-light" placeholder="Nhập mật khẩu ban đầu" required autocomplete="current-password">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu mới</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-key"></i></span>
                    <input type="password" name="new_password" class="form-control border-start-0 bg-light" placeholder="Nhập mật khẩu mới" required autocomplete="new-password">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Xác nhận mật khẩu mới</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-check-circle"></i></span>
                    <input type="password" name="confirm_password" class="form-control border-start-0 bg-light" placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-save me-1"></i>Đổi mật khẩu
            </button>
            <div class="text-center mt-3">
                <a href="{% url 'logout' %}" class="text-danger text-decoration-none logout-link">
                    <i class="fas fa-sign-out-alt me-1"></i>Đăng xuất
                </a>
            </div>
        </form>
    </div>
</body>
</html>
