<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu lần đầu - MyAnDong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }
        .btn-primary {
            background-color: #ef4444;
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="text-center mb-4">
            <i class="fas fa-shield-alt text-danger" style="font-size: 3rem;"></i>
            <h4 class="fw-bold text-dark mt-3">Yêu cầu đổi mật khẩu</h4>
            <p class="text-muted">Đây là lần đầu bạn đăng nhập. Vui lòng đổi mật khẩu để bảo mật tài khoản.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'danger' }} d-flex align-items-center" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <div>{{ message }}</div>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Mật khẩu hiện tại</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-unlock text-muted"></i></span>
                    <input type="password" name="old_password" class="form-control border-start-0 bg-light" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Mật khẩu mới</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-key text-muted"></i></span>
                    <input type="password" name="new_password" class="form-control border-start-0 bg-light" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">Xác nhận mật khẩu mới</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-check-circle text-muted"></i></span>
                    <input type="password" name="confirm_password" class="form-control border-start-0 bg-light" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill">
                <i class="fas fa-save me-2"></i>Đổi mật khẩu
            </button>
            <div class="text-center mt-3">
                <a href="{% url 'logout' %}" class="text-danger text-decoration-none"><i class="fas fa-sign-out-alt me-1"></i> Đăng xuất</a>
            </div>
        </form>
    </div>
</body>
</html>
