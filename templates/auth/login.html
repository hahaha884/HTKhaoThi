<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Trường tiểu học Đặng Văn Ngữ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 36px 32px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
        }

        .login-icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #eef2ff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .login-box h2 {
            font-size: 1.32rem;
            font-weight: 700;
            color: #1e293b;
            margin-top: 4px;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .login-box .subtitle {
            font-size: 0.88rem;
            color: #64748b;
            margin-bottom: 22px;
        }

        .btn-primary {
            background-color: #4f46e5;
            border: none;
            padding: 11px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-control {
            font-size: 0.92rem;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input-group-text {
            font-size: 0.92rem;
            padding: 10px 14px;
            border-radius: 8px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="text-center mb-3">
            <div class="login-icon-wrap">
                <i class="fas fa-school text-primary fs-3"></i>
            </div>
            <h2 class="fw-bold text-dark">Trường tiểu học Đặng Văn Ngữ</h2>
            <p class="subtitle">Hệ thống Quản lý Khảo thí Tiểu học</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger d-flex align-items-center py-2 px-3 mb-3" style="font-size: 0.88rem;" role="alert">
            <i class="fas fa-exclamation-circle me-2 flex-shrink-0"></i>
            <div>{{ message }}</div>
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Số điện thoại</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-phone"></i></span>
                    <input type="text" name="sdt" class="form-control border-start-0 bg-light"
                        placeholder="Nhập số điện thoại" required autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 bg-light"
                        placeholder="Nhập mật khẩu" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">
                <i class="fas fa-sign-in-alt me-1"></i>Đăng nhập
            </button>
        </form>
    </div>
</body>

</html>
