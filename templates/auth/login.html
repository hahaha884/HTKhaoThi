<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Trường tiểu học Đặng Văn Ngữ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dbeafe 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: white;
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 800px;
        }

        .login-box i.fa-school {
            font-size: 80px !important;
        }

        .login-box h2 {
            font-size: 48px;
            margin-top: 20px !important;
        }

        .login-box p.fs-5 {
            font-size: 24px !important;
            margin-bottom: 40px !important;
        }

        .btn-primary {
            background-color: #4f46e5;
            border: none;
            padding: 20px;
            font-weight: 600;
            font-size: 28px;
            border-radius: 40px !important;
        }

        .btn-primary:hover {
            background-color: #4338ca;
        }

        .form-label {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .form-control {
            font-size: 28px !important;
            padding: 20px 25px;
            height: auto;
        }

        .input-group-text {
            font-size: 28px;
            padding: 20px 25px;
        }

        .input-group-text i {
            font-size: 28px !important;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="text-center mb-4">
            <i class="fas fa-school text-primary" style="font-size: 3.5rem;"></i>
            <h2 class="fw-bold text-dark mt-3" style="font-size: 38px;">Trường tiểu học Đặng Văn Ngữ</h2>
            <p class="text-muted fs-5">Hệ thống Quản lý Khảo thí Tiểu học</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <div>{{ message }}</div>
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Số điện thoại</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-phone text-muted"></i></span>
                    <input type="text" name="sdt" class="form-control border-start-0 bg-light"
                        placeholder="Nhập số điện thoại" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 bg-light"
                        placeholder="Nhập mật khẩu" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill mb-3">Đăng nhập</button>
        </form>
    </div>
</body>

</html>
